<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mèo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            position: relative;
            width: 350px;
            height: 550px;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.2) 60%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
            padding: 30px;
            color: #ffffff;
        }
        .card-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .card-description {
            font-size: 14px;
            line-height: 1.5;
            color: #cccccc;
            margin-bottom: 20px;
        }
        .card-link {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .card-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <img class="card-image" src="mèo.jpg" alt="mèo iu dấu">
        
        <div class="card-overlay">
            <h2 class="card-title">Vật nuôi được ưa chuộng  </h2>
            <p class="card-description">Tại sao loài mèo lại được giới trẻ ưa thích ?</p>
            <a href="#" class="card-link">Tìm hiểu thêm &#x2192;</a>
        </div>
    </div>

</body>
</html>
