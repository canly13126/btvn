<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập xoay khối DIV</title>
    <style>
        .box-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 400px; 
        }
        .rotate-box {
            width: 150px;
            height: 150px;
            background-color: #4caf50;
            color: #333333;
            font-family: Arial, sans-serif;
            padding: 10px;
            box-sizing: border-box;
            transition: transform 0.5s ease;
        }
        .rotate-box:hover {
            transform: rotate(45deg);
        }
    </style>
</head>
<body>

    <div class="box-container">
        <div class="rotate-box">
            Di chuột vào tôi!
        </div>
    </div>

</body>
</html>
